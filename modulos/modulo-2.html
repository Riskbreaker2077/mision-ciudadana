<style>/* ─────────────────────────────────────────────────────────
   CURSO APRENDIZAJE MÓVIL — Estilos retro arcade neón
   ───────────────────────────────────────────────────────── */

:root {
  --bg: #0d0a05;
  --bg-2: #1a1108;
  --bg-3: #2a1a0c;
  --ink: #fff5e0;
  --ink-dim: #c8b08a;
  --neon-purple: #8b5cf6;     /* púrpura corrupto */
  --neon-orange: #d97706;     /* oro oxidado */
  --neon-green: #84cc16;      /* verde justicia (lima) */
  --neon-yellow: #f5c518;     /* oro */
  --neon-cyan: #3b82f6;       /* azul ley */
  --neon-pink: #dc2626;       /* rojo sangre / alerta */
  --shadow-hard: 4px 4px 0 #000;
  --font-arcade: "Press Start 2P", "VT323", monospace;
  --font-mono: "VT323", "IBM Plex Mono", monospace;
  --font-text: "Space Grotesk", system-ui, sans-serif;
}

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background:
    radial-gradient(circle at 20% 10%, rgba(139,92,246,0.16) 0%, transparent 50%),
    radial-gradient(circle at 80% 90%, rgba(220,38,38,0.14) 0%, transparent 50%),
    radial-gradient(circle at 50% 50%, rgba(245,197,24,0.06) 0%, transparent 60%),
    #08050a;
  font-family: var(--font-text);
  color: var(--ink);
  overflow-x: hidden;
}

#root, #root > * {
  height: 100%;
  min-height: 100%;
}

/* Subtle CRT scanlines on body */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1000;
  background: repeating-linear-gradient(
    to bottom,
    rgba(0,0,0,0) 0px,
    rgba(0,0,0,0) 2px,
    rgba(0,0,0,0.06) 3px,
    rgba(0,0,0,0) 4px
  );
}

/* App stage — full viewport mobile web app shell */
.stage {
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  position: relative;
}

.stage-title {
  display: none;
}

/* Web app shell — caps width on desktop, full bleed on mobile */
.webapp-shell {
  flex: 1;
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
  position: relative;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  min-height: 100dvh;
  box-shadow: 0 0 60px rgba(139,92,246,0.15);
}

/* ── Screen container — fills the web app shell ──────────── */
.screen {
  flex: 1;
  width: 100%;
  min-height: 100vh;
  min-height: 100dvh;
  background:
    linear-gradient(180deg, #0d0a05 0%, #2a1a0c 100%);
  color: var(--ink);
  font-family: var(--font-text);
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
}

.screen::before {
  /* CRT scanlines inside screen */
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 50;
  background: repeating-linear-gradient(
    to bottom,
    rgba(0,0,0,0) 0px,
    rgba(0,0,0,0) 2px,
    rgba(139,92,246,0.04) 3px,
    rgba(0,0,0,0) 4px
  );
}

.screen::after {
  /* corner glow */
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 51;
  background: radial-gradient(circle at 50% 100%, rgba(139,92,246,0.18), transparent 60%);
}

.screen-body {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 36px 20px 110px;
  position: relative;
  z-index: 2;
  scrollbar-width: none;
}
/* Title screen gets a touch more breathing room at top */
.screen-body--title {
  padding-top: 48px;
}
.screen-body::-webkit-scrollbar { display: none; }

/* ── Pixel grid background ────────────────────────────────── */
.pixel-grid {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(139,92,246,0.08) 1px, transparent 1px),
    linear-gradient(90deg, rgba(139,92,246,0.08) 1px, transparent 1px);
  background-size: 20px 20px;
  z-index: 0;
}

/* ── Headings ─────────────────────────────────────────────── */
.h-arcade {
  font-family: var(--font-arcade);
  letter-spacing: 0.05em;
  line-height: 1.4;
}
/* Boost minimum legibility of arcade font by globally upscaling small sizes */
[style*="var(--font-arcade)"], .h-arcade {
  /* no-op — kept for clarity */
}
.h-mono {
  font-family: var(--font-mono);
  letter-spacing: 0.02em;
  line-height: 1.1;
}

.glow-purple { text-shadow: 0 0 8px rgba(139,92,246,0.8), 0 0 16px rgba(139,92,246,0.4); }
.glow-orange { text-shadow: 0 0 8px rgba(217,119,6,0.8), 0 0 16px rgba(217,119,6,0.4); }
.glow-green  { text-shadow: 0 0 8px rgba(132,204,22,0.8),  0 0 16px rgba(132,204,22,0.4); }
.glow-yellow { text-shadow: 0 0 8px rgba(245,197,24,0.8), 0 0 16px rgba(245,197,24,0.4); }
.glow-cyan   { text-shadow: 0 0 8px rgba(59,130,246,0.8), 0 0 16px rgba(59,130,246,0.4); }
.glow-pink   { text-shadow: 0 0 8px rgba(220,38,38,0.8), 0 0 16px rgba(220,38,38,0.4); }

/* ── Pixel button ─────────────────────────────────────────── */
.px-btn {
  font-family: var(--font-arcade);
  font-size: 12px;
  letter-spacing: 0.08em;
  padding: 14px 18px;
  background: var(--neon-yellow);
  color: #0d0a05;
  border: none;
  outline: 3px solid #0d0a05;
  outline-offset: 0;
  box-shadow:
    4px 4px 0 #0d0a05,
    4px 4px 0 3px var(--neon-yellow);
  cursor: pointer;
  transition: transform 0.08s, box-shadow 0.08s;
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  text-transform: uppercase;
  user-select: none;
}
.px-btn:active {
  transform: translate(4px, 4px);
  box-shadow: 0 0 0 #0d0a05, 0 0 0 3px var(--neon-yellow);
}
.px-btn--purple { background: var(--neon-purple); color: #fff; box-shadow: 4px 4px 0 #0d0a05, 4px 4px 0 3px var(--neon-purple); }
.px-btn--purple:active { box-shadow: 0 0 0 #0d0a05, 0 0 0 3px var(--neon-purple); }
.px-btn--orange { background: var(--neon-orange); color: #fff; box-shadow: 4px 4px 0 #0d0a05, 4px 4px 0 3px var(--neon-orange); }
.px-btn--orange:active { box-shadow: 0 0 0 #0d0a05, 0 0 0 3px var(--neon-orange); }
.px-btn--green { background: var(--neon-green); color: #0d0a05; box-shadow: 4px 4px 0 #0d0a05, 4px 4px 0 3px var(--neon-green); }
.px-btn--green:active { box-shadow: 0 0 0 #0d0a05, 0 0 0 3px var(--neon-green); }
.px-btn--cyan { background: var(--neon-cyan); color: #0d0a05; box-shadow: 4px 4px 0 #0d0a05, 4px 4px 0 3px var(--neon-cyan); }
.px-btn--cyan:active { box-shadow: 0 0 0 #0d0a05, 0 0 0 3px var(--neon-cyan); }
.px-btn--ghost {
  background: transparent;
  color: var(--neon-cyan);
  outline: 2px solid var(--neon-cyan);
  box-shadow: 3px 3px 0 var(--neon-cyan);
  font-size: 11px;
  padding: 10px 14px;
}
.px-btn--ghost:active { box-shadow: 0 0 0 var(--neon-cyan); transform: translate(3px,3px); }
.px-btn[disabled] { opacity: 0.4; cursor: not-allowed; }

/* ── Pixel card ───────────────────────────────────────────── */
.px-card {
  background: rgba(26,17,8,0.85);
  border: 2px solid var(--neon-purple);
  box-shadow: 4px 4px 0 #0d0a05, 4px 4px 0 2px var(--neon-purple);
  padding: 18px;
  position: relative;
}
.px-card--orange { border-color: var(--neon-orange); box-shadow: 4px 4px 0 #0d0a05, 4px 4px 0 2px var(--neon-orange); }
.px-card--green  { border-color: var(--neon-green);  box-shadow: 4px 4px 0 #0d0a05, 4px 4px 0 2px var(--neon-green);  }
.px-card--cyan   { border-color: var(--neon-cyan);   box-shadow: 4px 4px 0 #0d0a05, 4px 4px 0 2px var(--neon-cyan);   }
.px-card--yellow { border-color: var(--neon-yellow); box-shadow: 4px 4px 0 #0d0a05, 4px 4px 0 2px var(--neon-yellow); }

/* corner pixel decorations */
.px-card::before, .px-card::after {
  content: "";
  position: absolute;
  width: 6px;
  height: 6px;
  background: inherit;
  border-color: inherit;
}
.px-card::before { top: -4px; left: -4px; background: var(--neon-purple); }
.px-card::after  { bottom: -4px; right: -4px; background: var(--neon-purple); }
.px-card--orange::before, .px-card--orange::after { background: var(--neon-orange); }
.px-card--green::before,  .px-card--green::after  { background: var(--neon-green);  }
.px-card--cyan::before,   .px-card--cyan::after   { background: var(--neon-cyan);   }
.px-card--yellow::before, .px-card--yellow::after { background: var(--neon-yellow); }

/* ── Pixel input ──────────────────────────────────────────── */
.px-input {
  font-family: var(--font-mono);
  font-size: 22px;
  background: #0d0a05;
  color: var(--neon-green);
  border: 2px solid var(--neon-green);
  outline: none;
  padding: 12px 14px;
  width: 100%;
  box-sizing: border-box;
  letter-spacing: 0.05em;
